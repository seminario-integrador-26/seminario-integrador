# nginx interno del contenedor "web".
# Sirve los estáticos de public/ y pasa el PHP por FastCGI al contenedor "app".
# El TLS y el dominio los maneja el nginx del HOST (reverse proxy), no este.

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    # No exponer la versión de nginx.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache largo para assets con hash de Vite.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloquear acceso a dotfiles (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
